[workspace]
resolver = "3"
members = ["crates/hw-core", "src-tauri"]

[workspace.package]
version = "0.17.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
hw-core = { path = "crates/hw-core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

# Image work is unusable without optimisation; keep dependencies fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
